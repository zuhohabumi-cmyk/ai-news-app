name: Daily AI News Update & Deploy

on:
  schedule:
    # 毎朝 JST 5:30 (UTC 20:30) に自動実行
    - cron: '30 20 * * *'
  workflow_dispatch: # GitHubのWeb画面から手動でいつでも即時実行可能

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 依存ライブラリのインストール
        run: npm ci

      - name: アプリアイコンと最新ニュースの収集・要約・生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run build

      - name: GitHub Pages へのデプロイ設定
        uses: actions/configure-pages@v5

      - name: 成果物 (publicディレクトリ) のアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: GitHub Pages へ公開
        id: deployment
        uses: actions/deploy-pages@v4
